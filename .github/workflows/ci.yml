name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python source syntax
        run: python -m compileall -q frontier_scaling.py fsl_adaptive fsl_sources fsl_timecourse fsl_functional scripts tests
      - name: Legacy and adaptive regression tests
        run: python -m unittest discover -s tests -v
      - name: Legacy v0.1 reference estimate
        run: python frontier_scaling.py forecast --scenario rubin_100mw_reference --as-of 2026-11-06
      - name: Adaptive v0.2 reproducibility smoke test
        run: |
          python -m fsl_adaptive.cli init --db /tmp/fsl_ci.sqlite
          python -m fsl_adaptive.cli forecast --db /tmp/fsl_ci.sqlite --as-of 2026-11-06 --year 2029 --include-planned --output /tmp/fsl_forecast.json
          python -m fsl_adaptive.cli weights --db /tmp/fsl_ci.sqlite --as-of 2026-11-06
          python -c "import json; p=json.load(open('/tmp/fsl_forecast.json')); assert p['cognition']['measured'] is False; assert p['ensemble']['online_update']['state']=='uncalibrated'"
      - name: New v0.3 multichannel source integration (offline fixtures only)
        run: |
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite init
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite --retrieved-on 2026-11-06 hf-model --id synthetic/research-model --offline-json tests/fixtures/hf_model_synthetic.json
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite --retrieved-on 2026-11-06 arena --config text --offline-json tests/fixtures/arena_synthetic.json
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite --retrieved-on 2026-11-06 hf-benchmark --dataset SWE-bench/SWE-bench_Verified --offline-json tests/fixtures/hf_benchmark_synthetic.json
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite --retrieved-on 2026-11-06 community --file tests/fixtures/community_synthetic.json
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite observations --channel community --as-of 2026-11-06
      - name: v0.4 methodology-break and evidence-readiness smoke tests
        run: |
          python -m fsl_timecourse.cli method-breaks
          python -m fsl_timecourse.cli --db /tmp/fsl_sources_ci.sqlite readiness --as-of 2026-11-06
      - name: v0.5 task duration horizon (synthetic smoke test only)
        run: |
          python -m fsl_timecourse.horizon_cli estimate --input tests/fixtures/synthetic_horizon_baseline.json --as-of 2026-11-07 --bootstrap 60 --output /tmp/fsl_horizon_v05.json
          python -m fsl_timecourse.horizon_cli compare --baseline tests/fixtures/synthetic_horizon_baseline.json --candidate tests/fixtures/synthetic_horizon_candidate.json --as-of 2026-11-07 --bootstrap 0 --output /tmp/fsl_horizon_comparison_v05.json
          python -c "import json; p=json.load(open('/tmp/fsl_horizon_comparison_v05.json')); assert p['general_intelligence_multiplier'] is None; assert p['is_synthetic']"
      - name: v0.6 actual user-defined functional objectives (synthetic protocol check only)
        run: |
          python -m fsl_functional.cli --db /tmp/fsl_functional_game.sqlite ingest-example --file tests/fixtures/functional_game_synthetic.json
          python -m fsl_functional.cli --db /tmp/fsl_functional_game.sqlite audit --run-id synthetic-game --as-of 2026-02-07T00:00:00Z --output /tmp/fsl_functional_game.json
          python -m fsl_functional.cli --db /tmp/fsl_functional_robot.sqlite ingest-example --file tests/fixtures/functional_embodied_synthetic.json
          python -m fsl_functional.cli --db /tmp/fsl_functional_robot.sqlite audit --run-id synthetic-embodied --as-of 2026-01-10T00:00:00Z --output /tmp/fsl_functional_embodied.json
          python -c "import json; g=json.load(open('/tmp/fsl_functional_game.json')); p=json.load(open('/tmp/fsl_functional_embodied.json')); assert g['gates']['G3_few_round_world_class_usable_delivery']['state']=='simulated_candidate_not_empirical'; assert p['gates']['E1_embodied_multi_domain_adaptation']['state']=='simulated_candidate_not_empirical'; assert not g['externally_certified_result'] and not p['externally_certified_result']"
      - name: Legacy evidence date snapshot
        run: python frontier_scaling.py evidence --as-of 2026-11-06
