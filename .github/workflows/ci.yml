name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python source syntax
        run: python -m compileall -q frontier_scaling.py fsl_adaptive fsl_sources fsl_timecourse fsl_functional fsl_observatory fsl_interventions fsl_affordability fsl_economics fsl_history fsl_discourse fsl_civilization fsl_connectivity fsl_singularity fsl_legal scripts tests
      - name: Legacy and adaptive regression tests
        run: python -m unittest discover -s tests -v
      - name: Legacy v0.1 reference estimate
        run: python frontier_scaling.py forecast --scenario rubin_100mw_reference --as-of 2026-11-06
      - name: Adaptive v0.2 reproducibility smoke test
        run: |
          python -m fsl_adaptive.cli init --db /tmp/fsl_ci.sqlite
          python -m fsl_adaptive.cli forecast --db /tmp/fsl_ci.sqlite --as-of 2026-11-06 --year 2029 --include-planned --output /tmp/fsl_forecast.json
          python -m fsl_adaptive.cli weights --db /tmp/fsl_ci.sqlite --as-of 2026-11-06
          python -c "import json; p=json.load(open('/tmp/fsl_forecast.json')); assert p['cognition']['measured'] is False; assert p['ensemble']['online_update']['state']=='uncalibrated'"
      - name: New v0.3 multichannel source integration (offline fixtures only)
        run: |
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite init
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite --retrieved-on 2026-11-06 hf-model --id synthetic/research-model --offline-json tests/fixtures/hf_model_synthetic.json
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite --retrieved-on 2026-11-06 arena --config text --offline-json tests/fixtures/arena_synthetic.json
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite --retrieved-on 2026-11-06 hf-benchmark --dataset SWE-bench/SWE-bench_Verified --offline-json tests/fixtures/hf_benchmark_synthetic.json
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite --retrieved-on 2026-11-06 community --file tests/fixtures/community_synthetic.json
          python -m fsl_sources.cli --db /tmp/fsl_sources_ci.sqlite observations --channel community --as-of 2026-11-06
      - name: v0.4 methodology-break and evidence-readiness smoke tests
        run: |
          python -m fsl_timecourse.cli method-breaks
          python -m fsl_timecourse.cli --db /tmp/fsl_sources_ci.sqlite readiness --as-of 2026-11-06
      - name: v0.5 task duration horizon (synthetic smoke test only)
        run: |
          python -m fsl_timecourse.horizon_cli estimate --input tests/fixtures/synthetic_horizon_baseline.json --as-of 2026-11-07 --bootstrap 60 --output /tmp/fsl_horizon_v05.json
          python -m fsl_timecourse.horizon_cli compare --baseline tests/fixtures/synthetic_horizon_baseline.json --candidate tests/fixtures/synthetic_horizon_candidate.json --as-of 2026-11-07 --bootstrap 0 --output /tmp/fsl_horizon_comparison_v05.json
          python -c "import json; p=json.load(open('/tmp/fsl_horizon_comparison_v05.json')); assert p['general_intelligence_multiplier'] is None; assert p['is_synthetic']"
      - name: v0.6 actual user-defined functional objectives (synthetic protocol check only)
        run: |
          python -m fsl_functional.cli --db /tmp/fsl_functional_game.sqlite ingest-example --file tests/fixtures/functional_game_synthetic.json
          python -m fsl_functional.cli --db /tmp/fsl_functional_game.sqlite audit --run-id synthetic-game --as-of 2026-02-07T00:00:00Z --output /tmp/fsl_functional_game.json
          python -m fsl_functional.cli --db /tmp/fsl_functional_robot.sqlite ingest-example --file tests/fixtures/functional_embodied_synthetic.json
          python -m fsl_functional.cli --db /tmp/fsl_functional_robot.sqlite audit --run-id synthetic-embodied --as-of 2026-01-10T00:00:00Z --output /tmp/fsl_functional_embodied.json
          python -c "import json; g=json.load(open('/tmp/fsl_functional_game.json')); p=json.load(open('/tmp/fsl_functional_embodied.json')); assert g['gates']['G3_few_round_world_class_usable_delivery']['state']=='simulated_candidate_not_empirical'; assert p['gates']['E1_embodied_multi_domain_adaptation']['state']=='simulated_candidate_not_empirical'; assert not g['externally_certified_result'] and not p['externally_certified_result']"
      - name: v0.7 observer schema smoke (no internet, no fake certification)
        run: |
          python -m fsl_observatory.cli --db /tmp/fsl_observatory_ci.sqlite init
          python -c "from fsl_observatory.registry import connect; db=connect('/tmp/fsl_observatory_ci.sqlite'); assert db.execute('select count(*) from observer_receipts').fetchone()[0]==0; db.close()"
      - name: v0.8 blinded adaptation scenario replay (SYNTHETIC, not agent results)
        run: |
          python -m fsl_interventions.cli --db /tmp/fsl_g2_synthetic.sqlite synthetic-demo --file tests/fixtures/g2_intervention_synthetic.json --as-of 2026-01-18T00:00:00Z --output /tmp/fsl_g2_synthetic.json
          python -c "import json; a=json.load(open('/tmp/fsl_g2_synthetic.json')); assert a['four_case_recorded_outcomes_satisfied']; assert not a['G2_externally_verified'] and not a['G2_recorded_conditions_satisfied']; assert a['assessment_status']=='synthetic_demonstration_only'"
      - name: v0.8.1 affordability smoke (SYNTHETIC cost and plan source)
        run: |
          python -m fsl_affordability.cli analyze --file tests/fixtures/affordability_synthetic_48h.json --output /tmp/fsl_cost_48h.json
          python -c "import json; x=json.load(open('/tmp/fsl_cost_48h.json')); assert x['wall_hours']==48 and x['observed_active_hours']==8; assert x['total_monthly_cash_outlay_plus_variable_usd']=='216'; assert not x['can_sustain_48h_verified'] and x['cost_per_independently_verified_result_usd'] is None"
          python -m fsl_affordability.cli save --db /tmp/fsl_costs_ci.sqlite --file tests/fixtures/affordability_synthetic_48h.json
      - name: v0.8.2 task purchasing power and historical counterfactual (synthetic)
        run: |
          python -m fsl_economics.cli compare --input tests/fixtures/task_purchasing_power_synthetic.json --output /tmp/fsl_task_purchasing_power.json --save-db /tmp/fsl_economics_ci.sqlite --study-id synthetic-comparison
          python -m fsl_economics.cli history --input tests/fixtures/historical_task_cost_synthetic.json --output /tmp/fsl_historical_cost.json --save-db /tmp/fsl_economics_ci.sqlite --study-id synthetic-historical
          python -c "import json; p=json.load(open('/tmp/fsl_task_purchasing_power.json')); h=json.load(open('/tmp/fsl_historical_cost.json')); assert len(p['cohorts'])==3 and not p['has_independently_certified_result']; assert h['scenarios'][1]['status']=='historical_cost_unidentifiable' and h['scenarios'][3]['status']=='modern_replay_requires_real_trials'"
      - name: v0.8.3 dated original-publication versus source-capture cutoff
        run: |
          python -m fsl_economics.timeaxis_cli audit-sources --catalog data/verified_release_and_price_vintage_2026-11-07.json --as-of 2024-05-13 --mode strict_known_at_time --output /tmp/fsl_2024_strict.json
          python -m fsl_economics.timeaxis_cli audit-sources --catalog data/verified_release_and_price_vintage_2026-11-07.json --as-of 2024-05-13 --mode retrospective_reconstruction --output /tmp/fsl_2024_retrospective.json
          python -m fsl_economics.timeaxis_cli audit-sources --catalog data/verified_release_and_price_vintage_2026-11-07.json --as-of 2026-11-07 --mode strict_known_at_time --output /tmp/fsl_2026_strict.json
          python -m fsl_economics.timeaxis_cli audit-mission --file tests/fixtures/mission_clock_synthetic_2026-11-07.json --output /tmp/fsl_mission_clock.json
          python -m fsl_economics.timeaxis_cli audit-panel --file tests/fixtures/time_anchored_task_panel_synthetic.json --output /tmp/fsl_panel_clock.json
          python -c "import json; s=json.load(open('/tmp/fsl_2024_strict.json')); r=json.load(open('/tmp/fsl_2024_retrospective.json')); p=json.load(open('/tmp/fsl_panel_clock.json')); m=json.load(open('/tmp/fsl_mission_clock.json')); assert not any(x['included_for_requested_mode'] for x in s['rows']); assert sum(x['included_for_requested_mode'] for x in r['rows'])==2; assert len(p['observed_trial_clocks'])==3 and not p['can_assert_24_48h_autonomy']; assert m['elapsed_execution_hours']==47.5; assert s['report_generated_at_utc'] and s['report_generated_at_Asia_Taipei']"
      - name: v0.9 five-provider real history and strict source-vintage smoke
        run: |
          python -m fsl_history.cli validate --output /tmp/fsl_market_validate.json
          python -m fsl_history.cli timeline --as-of 2024-12-31 --mode strict_known_at_time --output /tmp/fsl_market_strict2024.json
          python -m fsl_history.cli timeline --as-of 2024-12-31 --mode retrospective --output /tmp/fsl_market_retro2024.json
          python -m fsl_history.cli matrix --month-ends '2024-12-31;2025-12-31;2026-11-07' --output /tmp/fsl_market_matrix.json
          python -c "import json; v=json.load(open('/tmp/fsl_market_validate.json')); s=json.load(open('/tmp/fsl_market_strict2024.json')); r=json.load(open('/tmp/fsl_market_retro2024.json')); m=json.load(open('/tmp/fsl_market_matrix.json')); assert v['event_count']>=40 and len(v['providers'])==5; assert s['included_count']==0; assert r['included_count']>=6; assert len(m['periods'])==3 and m['no_task_completion_scores_inferred']"
      - name: v0.10 dated public AGI/ASI speech corpus and anti-causality gates
        run: |
          python -m fsl_discourse.cli validate --output /tmp/fsl_speech_validate.json
          python -m fsl_discourse.cli asof --as-of 2024-12-31 --mode strict_known_at_time --output /tmp/fsl_speech_strict2024.json
          python -m fsl_discourse.cli asof --as-of 2024-12-31 --mode retrospective --output /tmp/fsl_speech_retro2024.json
          python -m fsl_discourse.cli speaker --speaker-id dario-amodei --as-of 2026-11-07 --output /tmp/fsl_speech_dario_timeline.json
          python -m fsl_discourse.cli links --as-of 2026-11-07 --output /tmp/fsl_speech_agnostic_links.json
          python -c "import json; f=lambda x:json.load(open('/tmp/'+x+'.json')); v=f('fsl_speech_validate'); s=f('fsl_speech_strict2024'); r=f('fsl_speech_retro2024'); d=f('fsl_speech_dario_timeline'); l=f('fsl_speech_agnostic_links'); assert v['interview_count']==7 and v['claim_count']==23 and v['organization_count']==6; assert s['included_claims']==0 and r['included_claims']>=15; assert d['source_publication_years']==['2023','2026']; assert l['causal_links_verified']==0 and l['actual_strategy_reversals_verified']==0"
      - name: v0.11 freeze-and-replay three longitudinal narratives (no AGI scoring)
        run: |
          python -m fsl_discourse.replay_cli validate --output /tmp/fsl_v011_validate.json
          python -m fsl_discourse.replay_cli case --case-id dario-2023-2026-scaling-diffusion --as-of 2023-08-08 --mode retrospective --output /tmp/fsl_v011_dario_past.json
          python -m fsl_discourse.replay_cli case --case-id dario-2023-2026-scaling-diffusion --as-of 2023-08-08 --mode strict_known_at_time --output /tmp/fsl_v011_dario_strict.json
          python -m fsl_discourse.replay_cli all --as-of 2026-11-07 --output /tmp/fsl_v011_three_cases.json
          python -m fsl_discourse.replay_export --as-of 2026-11-07 --output /tmp/fsl_v011_three_cases.csv
          python -c "import json,csv; v=json.load(open('/tmp/fsl_v011_validate.json')); p=json.load(open('/tmp/fsl_v011_dario_past.json')); s=json.load(open('/tmp/fsl_v011_dario_strict.json')); x=json.load(open('/tmp/fsl_v011_three_cases.json')); rows=list(csv.DictReader(open('/tmp/fsl_v011_three_cases.csv'))); assert v['case_count']==3 and v['interpretation_winners_declared']==0; assert not p['analyst_interpretations_visible_at_cutoff'] and s['documented_observation_count']==0; assert len(x['cases'])==3 and len(rows)==3 and x['actual_reversibility_certificates']==0; assert next(z for z in x['cases'] if z['speaker_id']=='demis-hassabis')['dated_forecast_statuses'][0]['status']=='not_due'; assert x['report_generated_at_Asia_Taipei']"
      - name: v0.12 source-dated rollout/access/rollback evidence gates
        run: |
          python -m fsl_discourse.divergence_cli validate --output /tmp/fsl_v012_valid.json
          python -m fsl_discourse.divergence_cli replay --as-of 2019-11-05 --mode strict_known_at_time --output /tmp/fsl_v012_strict2019.json
          python -m fsl_discourse.divergence_cli replay --as-of 2025-04-28 --mode retrospective --output /tmp/fsl_v012_pre_may_postmortem.json
          python -m fsl_discourse.divergence_cli replay --as-of 2026-11-07 --mode retrospective --output /tmp/fsl_v012_present.json
          python -m fsl_discourse.divergence_cli csv --as-of 2026-11-07 --output /tmp/fsl_v012_present.csv
          python -c "import json,csv; v=json.load(open('/tmp/fsl_v012_valid.json')); old=json.load(open('/tmp/fsl_v012_strict2019.json')); cur=json.load(open('/tmp/fsl_v012_present.json')); rows=list(csv.DictReader(open('/tmp/fsl_v012_present.csv',encoding='utf-8'))); assert v['case_count']==8 and v['source_count']==15; assert old['documented_local_changes_reported_by_sources']==0; assert len(rows)==8 and cur['documented_local_changes_reported_by_sources']==4; assert cur['fully_independently_adjudicated_direction_changes']==0 and cur['scientifically_verified_personal_belief_change']==0; assert sum(r['provider_reported_unexpected_effect']=='True' for r in rows)==1"
      - name: v0.13 GICCF capability taxonomy smoke test (SYNTHETIC)
        run: |
          python -m fsl_civilization.cli catalog
          python -m fsl_civilization.cli audit --file tests/fixtures/giccf_observations_synthetic_v0.13.json --as-of 2026-11-06 --output /tmp/fsl_giccf_synthetic.json
          python -c "import json; x=json.load(open('/tmp/fsl_giccf_synthetic.json')); assert x['catalog_indicators']==224 and x['catalog_domains']==38 and x['visible_at_cutoff']==1 and not x['independent_capability_certification']"
      - name: v0.14 GICCF counterfactual definition-evolution smoke (SYNTHETIC)
        run: |
          python -m fsl_civilization.counterfactual_cli protocol
          python -m fsl_civilization.counterfactual_cli audit --file tests/fixtures/giccf_counterfactual_synthetic_v0.14.json --as-of 2026-11-07T08:00:00Z --output /tmp/fsl_v014_before.json
          python -m fsl_civilization.counterfactual_cli audit --file tests/fixtures/giccf_counterfactual_synthetic_v0.14.json --as-of 2026-11-07T18:00:00Z --output /tmp/fsl_v014_after.json
          python -c "import json; a=json.load(open('/tmp/fsl_v014_before.json')); b=json.load(open('/tmp/fsl_v014_after.json')); assert a['visible_definition_events']==1 and a['active_assertions'][0]['definition_event_id']=='synthetic-def-frontier-v1'; assert b['visible_definition_events']==2 and b['current_assessments_after_revision']==1 and b['certified_counterfactual_year'] is None and b['universal_superhuman_score'] is None"
      - name: v0.16 connectivity, safe offline and API-policy controls (SYNTHETIC)
        run: |
          python -m fsl_connectivity.cli catalog
          python -m fsl_connectivity.cli audit --file tests/fixtures/connectivity_synthetic_v0.16.json --as-of 2026-11-08T04:45:00+08:00 --output /tmp/fsl_net_before.json
          python -m fsl_connectivity.cli audit --file tests/fixtures/connectivity_synthetic_v0.16.json --as-of 2026-11-08 --output /tmp/fsl_net_after.json
          python -c "import json; a=json.load(open('/tmp/fsl_net_before.json')); b=json.load(open('/tmp/fsl_net_after.json')); assert a['events_visible']==4 and b['active_event_count']==4 and b['indicator_count']==70; assert b['failure_scope_counts']['physical_up_service_denied']==1 and not b['ai_capability_independently_certified']"
      - name: v0.17 SAS-01 systemic closure versus civilization gain (SYNTHETIC)
        run: |
          python -m fsl_singularity.cli definition
          python -m fsl_singularity.cli audit --file tests/fixtures/systemic_singularity_synthetic_v0.17.json --as-of 2026-11-07T20:00:00+08:00 --output /tmp/fsl_sas_before.json
          python -m fsl_singularity.cli audit --file tests/fixtures/systemic_singularity_synthetic_v0.17.json --as-of 2026-11-08 --output /tmp/fsl_sas_after.json
          python -c "import json; a=json.load(open('/tmp/fsl_sas_before.json')); b=json.load(open('/tmp/fsl_sas_after.json')); assert a['visible_events']==3 and b['archived_events']==7 and b['current_assertions_after_correction']==6; assert b['canonical_two_gates']==['Sigma_sys','Sigma_civ'] and not b['systemic_singularity_certified'] and not b['civilizational_singularity_certified']"
      - name: v0.18 dated legal feasibility, advisory and vote-certification guards
        run: |
          python -m fsl_legal.cli validate
          python -m fsl_legal.cli replay --as-of 2026-11-07 --mode strict_known_at_time --output /tmp/fsl_law_strict.json
          python -m fsl_legal.cli replay --as-of 2026-11-07 --mode retrospective_reconstruction --output /tmp/fsl_law_retrospective.json
          python -m fsl_legal.cli replay --as-of 2026-11-08 --mode strict_known_at_time --output /tmp/fsl_law_present.json
          python -c "import json; a=json.load(open('/tmp/fsl_law_strict.json')); b=json.load(open('/tmp/fsl_law_retrospective.json')); c=json.load(open('/tmp/fsl_law_present.json')); assert a['visible_source_events']==0 and b['visible_source_events']==7 and c['active_after_corrections']==7; assert c['nonbinding_advisory_votes']==1 and c['local_binding_candidate_pending_certification']==1 and not c['causal_effect_certified']"
      - name: Legacy evidence date snapshot
        run: python frontier_scaling.py evidence --as-of 2026-11-06
