name: Targeted Arena historical evidence

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Exact published Arena model_name'
        required: true
        default: 'gpt-4o-2024-05-13'
        type: string
      arena_config:
        description: 'Arena subset, e.g. text_style_control or agent'
        required: true
        default: 'text_style_control'
        type: string
  push:
    paths:
      - '.github/workflows/arena-history.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import up to 300 targeted historical Arena rows
        env:
          ARENA_MODEL: ${{ inputs.model_name || 'gpt-4o-2024-05-13' }}
          ARENA_CONFIG: ${{ inputs.arena_config || 'text_style_control' }}
        run: |
          python -m fsl_timecourse.arena_history \
            --db reports/arena_history.sqlite \
            --model "$ARENA_MODEL" \
            --config "$ARENA_CONFIG" \
            --max-pages 3 \
            --report reports/arena_history_manifest.json
      - name: Inspect sample methodology and historical readiness
        run: |
          python -m fsl_timecourse.cli --db reports/arena_history.sqlite readiness \
            --output reports/arena_history_readiness.json
      - name: Preserve history snapshot and explicit limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-history-${{ github.run_id }}
          path: |
            reports/arena_history.sqlite
            reports/arena_history_manifest.json
            reports/arena_history_readiness.json
          retention-days: 90
          if-no-files-found: warn
