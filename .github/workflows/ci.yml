name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible example
        run: python frontier_scaling.py forecast --scenario rubin_100mw_reference --as-of 2026-11-06
      - name: Evidence date snapshot
        run: python frontier_scaling.py evidence --as-of 2026-11-06
